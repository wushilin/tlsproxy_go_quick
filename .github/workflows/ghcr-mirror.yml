# Copies an image already on Docker Hub to ghcr.io unchanged (every platform,
# same layers), for releases published before ci.yml pushed to both.
name: ghcr-mirror

on:
  workflow_dispatch:
    inputs:
      version:
        description: Image tag to copy, e.g. v1.2.0
        required: true
      latest:
        description: Also tag it latest on ghcr.io
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FROM: docker.io/wushilin/tlsproxy_go_quick
      TO: ghcr.io/wushilin/tlsproxy_go_quick
      VERSION: ${{ inputs.version }}
      LATEST: ${{ inputs.latest }}
      SOURCE: ${{ github.server_url }}/${{ github.repository }}
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Copy
        run: |
          case "$VERSION" in v[0-9]*) ;; *) echo "not a version: $VERSION"; exit 1;; esac
          tags=(--tag "$TO:$VERSION")
          if [ "$LATEST" = true ]; then tags+=(--tag "$TO:latest"); fi
          # The source annotation links the package to this repository.
          docker buildx imagetools create "${tags[@]}" \
            --annotation "index:org.opencontainers.image.source=$SOURCE" \
            "$FROM:$VERSION"
          docker buildx imagetools inspect "$TO:$VERSION"

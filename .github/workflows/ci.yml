# Tests on Linux (race detector, live sites; Pebble, the ACME test CA, runs in
# every test run, in-process and offline), Windows, and a real FreeBSD VM.
# Builds amd64 and arm64 binaries for all three operating systems and the
# container image; tags push the image to docker.io/wushilin/tlsproxy_go_quick and
# ghcr.io/wushilin/tlsproxy_go_quick and publish a GitHub Release, only after
# all checks pass.
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Read-only by default; only the release job may write.
permissions:
  contents: read

# A newer push to the same branch makes the older run pointless. Tag runs are
# never cancelled: each one is a release.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l $(git ls-files '*.go' ':!vendor'))" || { gofmt -l $(git ls-files '*.go' ':!vendor'); exit 1; }
      - run: go vet ./...
      - name: Test (race detector; live sites included)
        env:
          TLSPROXY_LIVE: "1"
        run: go test -race -count=1 ./...

  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - name: Test on Windows
        run: go test -count=1 ./...

  freebsd:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Test on FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.3"
          usesh: true
          # The packaged Go may be older than go.mod asks for; it then fetches the
          # right toolchain by itself (GOTOOLCHAIN=auto), which needs the CA roots.
          prepare: pkg install -y go ca_root_nss
          run: |
            set -e
            freebsd-version
            go version
            CGO_ENABLED=0 go test -count=1 ./...
            CGO_ENABLED=0 go build -o tlsproxy .
            file tlsproxy
            ./tlsproxy --version
            ./tlsproxy config.toml --test foo.wushilin.net evil.com

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Cross-build (static, no cgo)
        env:
          CGO_ENABLED: "0"
        run: |
          version=$(git describe --tags --always --dirty)
          if [ "$GITHUB_REF_TYPE" = tag ]; then version=$GITHUB_REF_NAME; fi
          for target in freebsd/amd64 freebsd/arm64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            suffix=""
            if [ "${target%/*}" = windows ]; then suffix=".exe"; fi
            GOOS=${target%/*} GOARCH=${target#*/} go build -trimpath -ldflags="-s -w -X main.version=$version" \
              -o "tlsproxy-${target%/*}-${target#*/}${suffix}" .
          done
          sha256sum tlsproxy-* > SHA256SUMS
          ls -l tlsproxy-*
          ./tlsproxy-linux-amd64 --version
      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: |
            tlsproxy-*
            SHA256SUMS
            config.toml

  # The container image (Dockerfile). Every run builds it, so a change that
  # breaks the image fails here; a "v*" tag also pushes it, for linux/amd64
  # and linux/arm64, tagged with the version and as latest. The Go build is
  # cross-compiled in the Dockerfile, so no emulation is needed.
  docker:
    needs: [test, windows, freebsd, build] # nothing is pushed unless everything passed
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # push to ghcr.io with the job's own token
    env:
      IMAGE: docker.io/wushilin/tlsproxy_go_quick
      GHCR_IMAGE: ghcr.io/wushilin/tlsproxy_go_quick
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe needs the tags
      - name: Version
        id: version
        run: |
          version=$(git describe --tags --always --dirty)
          if [ "$GITHUB_REF_TYPE" = tag ]; then version=$GITHUB_REF_NAME; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          username: wushilin
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Log in to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and, for a tag, push)
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: VERSION=${{ steps.version.outputs.version }}
          platforms: ${{ startsWith(github.ref, 'refs/tags/v') && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          # The source annotation links the ghcr.io package to this repository
          # (its Packages list). Index annotations need a multi-platform push.
          annotations: ${{ startsWith(github.ref, 'refs/tags/v') && format('index:org.opencontainers.image.source={0}/{1}', github.server_url, github.repository) || '' }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:latest
            ${{ env.GHCR_IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.GHCR_IMAGE }}:latest

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, windows, freebsd, build, docker] # nothing is published unless everything passed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: binaries
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
          gh release upload "$GITHUB_REF_NAME" tlsproxy-* SHA256SUMS config.toml --clobber

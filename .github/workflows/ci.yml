# Tests on Linux (race detector, live sites, a Pebble ACME CA) and on a real
# FreeBSD VM; cross-builds static binaries; for tags "v*" publishes them as a
# GitHub Release, but only when both test jobs passed.
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Read-only by default; only the release job may write.
permissions:
  contents: read

# A newer push to the same branch makes the older run pointless. Tag runs are
# never cancelled: each one is a release.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l $(git ls-files '*.go' ':!vendor'))" || { gofmt -l $(git ls-files '*.go' ':!vendor'); exit 1; }
      - run: go vet ./...
      - name: Test (race detector; live sites and a Pebble ACME CA included)
        env:
          TLSPROXY_LIVE: "1"
          TLSPROXY_PEBBLE: "1"
        run: go test -race -count=1 ./...
      - name: Test on Windows' code path (compile only)
        run: GOOS=windows go vet ./...

  freebsd:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Test on FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.3"
          usesh: true
          # The packaged Go may be older than go.mod asks for; it then fetches the
          # right toolchain by itself (GOTOOLCHAIN=auto), which needs the CA roots.
          prepare: pkg install -y go ca_root_nss
          run: |
            set -e
            freebsd-version
            go version
            CGO_ENABLED=0 go test -count=1 ./...
            CGO_ENABLED=0 go build -o tlsproxy .
            file tlsproxy
            ./tlsproxy --version
            ./tlsproxy config.toml --test foo.wushilin.net evil.com

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Cross-build (static, no cgo)
        env:
          CGO_ENABLED: "0"
        run: |
          version=$(git describe --tags --always --dirty)
          if [ "$GITHUB_REF_TYPE" = tag ]; then version=$GITHUB_REF_NAME; fi
          for target in freebsd/amd64 freebsd/arm64 linux/amd64 linux/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} go build -trimpath -ldflags="-s -w -X main.version=$version" \
              -o "tlsproxy-${target%/*}-${target#*/}" .
          done
          sha256sum tlsproxy-* > SHA256SUMS
          ls -l tlsproxy-*
          ./tlsproxy-linux-amd64 --version
      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: |
            tlsproxy-*
            SHA256SUMS
            config.toml

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, freebsd, build] # nothing is published unless everything passed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: binaries
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
          gh release upload "$GITHUB_REF_NAME" tlsproxy-* SHA256SUMS config.toml --clobber

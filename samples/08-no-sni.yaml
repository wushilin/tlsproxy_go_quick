# Clients that send no SNI at all (old devices, bare-IP access, health checks)
# are matched with the literal domain $no_sni. Here they go to
# a default backend, named hosts are routed normally, and the rest is denied.
#
# $no_sni matches only a missing SNI; a host that is literally called "none"
# still has an SNI (match that one with ^none$ if you ever need to; likewise
# ^any$). The target must be a literal: there is nothing to capture.
#
#> <none>              => 10.0.0.99:443
#> www.example.com     => 10.0.0.10:443
#> api.example.com     => 10.0.0.10:443
#> none                => DENY
#> other.org           => DENY

listeners:
  - name: https
    bind: [0.0.0.0]
    port: 443

routes:
  - listener: https
    rules:
      - domain: $no_sni
        target: "10.0.0.99:443"

      - domain: www.example.com
        target: "10.0.0.10:443"

      - domain: api.example.com
        target: "10.0.0.10:443"

      - domain: $anything_else
        action: deny

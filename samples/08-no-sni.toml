# Clients that send no SNI at all (old devices, bare-IP access, health checks)
# are matched with the literal pattern NONE (any letter case). Here they go to
# a default backend, named hosts are routed normally, and the rest is denied.
#
# NONE matches only a missing SNI; a host that is literally called "none"
# still has an SNI (match that one with ^none$ if you ever need to).
# target_host must be a literal: there are no capture groups to expand.
#
#> <none>              => 10.0.0.99:443
#> www.example.com     => 10.0.0.10:443
#> api.example.com     => 10.0.0.10:443
#> none                => DENY
#> other.org           => DENY

[global]
bind = 0.0.0.0
port = 443

[[host]]
pattern = NONE
target_host = 10.0.0.99

[[host]]
pattern = (www|api)\.example\.com
target_host = 10.0.0.10

[[host]]
pattern = .*
action = deny

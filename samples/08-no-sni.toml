# Clients that send no SNI at all (old devices, bare-IP access, health checks)
# are matched with the literal pattern NONE (any letter case). Here they go to
# a default backend, named hosts are routed normally, and the rest is denied.
#
# NONE matches only a missing SNI; a host that is literally called "none"
# still has an SNI (match that one with ^none$ if you ever need to; likewise
# ^any$). target_host must be a literal: there is nothing to capture.
#
#> <none>              => 10.0.0.99:443
#> www.example.com     => 10.0.0.10:443
#> api.example.com     => 10.0.0.10:443
#> none                => DENY
#> other.org           => DENY

[[listener]]
name = https
bind = 0.0.0.0
port = 443

[[host]]
listener = https
pattern = NONE
target_host = 10.0.0.99
target_port = 443

[[host]]
listener = https
pattern = www.example.com
target_host = 10.0.0.10
target_port = 443

[[host]]
listener = https
pattern = api.example.com
target_host = 10.0.0.10
target_port = 443

[[host]]
listener = https
pattern = ANY
action = deny

# Home lab: one public IP on :443, several internal services by name.
#
#> nas.home.example.com      => 192.168.1.10:5001
#> photos.home.example.com   => 192.168.1.10:2342
#> ha.home.example.com       => 192.168.1.20:8123
#> vpn.home.example.com      => 192.168.1.1:4443
#> www.home.example.com      => 192.168.1.30:443
#> home.example.com          => 192.168.1.30:443
#> admin.home.example.com    => DENY
#> random.com                => DENY

[[listener]]
name = https
bind = 0.0.0.0
port = 443

[global]
idle_timeout = 3600          # long-lived sessions (NAS, Home Assistant websockets)

[[host]]
listener = https
pattern = nas.home.example.com
target_host = 192.168.1.10
target_port = 5001

[[host]]
listener = https
pattern = photos.home.example.com
target_host = 192.168.1.10
target_port = 2342

[[host]]
listener = https
pattern = ha.home.example.com
target_host = 192.168.1.20
target_port = 8123

[[host]]
listener = https
pattern = vpn.home.example.com
target_host = 192.168.1.1
target_port = 4443

# Never expose the admin UI. A literal name always wins, so this holds wherever
# the rule stands and whatever broader allow rules are added later.
[[host]]
listener = https
pattern = admin.home.example.com
action = deny

# The site itself, with and without www: one rule per name.
[[host]]
listener = https
pattern = home.example.com
target_host = 192.168.1.30
target_port = 443

[[host]]
listener = https
pattern = www.home.example.com
target_host = 192.168.1.30
target_port = 443

[[host]]
listener = https
pattern = ANY
action = deny

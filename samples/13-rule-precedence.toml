# Rule precedence: the most specific rule wins, wherever it stands in the file.
# This file is deliberately written "upside down" (broadest first) to show it.
#
#   1. NONE and literal names      vq.example.com        exact match; always win
#   2. wildcards                   *.example.com         a * is one label, or part of one; it never
#                                  api-*.example.com       crosses a dot, so *.example.com does not
#                                  *.*.example.com         match a.b.example.com. More literal
#                                                          characters win; then file order.
#   3. ANY                         ANY                   everything; always last
#
# There are no regular expressions and no **. Matching ignores case throughout.
# ${1}, ${2} ... are the *s from the left; ${host} is the whole name.
#
#> vq.example.com          => 10.0.0.1:443
#> VQ.Example.COM          => 10.0.0.1:443
#> files.example.com       => 10.0.1.1:8443
#> api-billing.example.com => 10.0.2.1:9000
#> api-.example.com        => 10.0.2.1:9000
#> a.b.example.com         => b-a.deep.lan:443
#> a.b.c.example.com       => 10.0.9.9:443
#> example.com             => 10.0.9.9:443
#> secret.example.com      => DENY
#> anything.else.org       => 10.0.9.9:443
#> <none>                  => 10.0.0.99:443

[[listener]]
name = https
bind = 0.0.0.0
port = 443

# ANY comes first in the file and is still evaluated last.
[[host]]
listener = https
pattern = ANY
target_host = 10.0.9.9
target_port = 443

# Exactly two labels under example.com: two *, two captures.
[[host]]
listener = https
pattern = *.*.example.com
target_host = ${2}-${1}.deep.lan
target_port = 443

# Exactly one label under example.com. example.com itself and a.b.c.example.com
# match none of the wildcards and fall through to ANY.
[[host]]
listener = https
pattern = *.example.com
target_host = 10.0.1.1
target_port = 8443

# More literal characters than *.example.com, so it wins for api-... names. A *
# inside a label may be empty: api-.example.com matches too.
[[host]]
listener = https
pattern = api-*.example.com
target_host = 10.0.2.1
target_port = 9000

# Literal names always win, allow or deny.
[[host]]
listener = https
pattern = vq.example.com
target_host = 10.0.0.1
target_port = 443

[[host]]
listener = https
pattern = secret.example.com
action = deny

# Clients without SNI; without this rule ANY would take them.
[[host]]
listener = https
pattern = NONE
target_host = 10.0.0.99
target_port = 443

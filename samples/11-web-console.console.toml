# The console's own settings, given with --console. The console can edit
# config.toml but never this file: no change made from the console can
# change its password or take it off the network.

[console]
bind = 0.0.0.0                     # default 127.0.0.1. With cert: the listener with exactly this
                                   #   bind and port serves it (or one of its own if none has)
port = 443                         # required
hostname = console.example.com     # with cert: the name it is served under (required)
cert = auto                        # auto (ACME) or local-ca / local-ca:ca002. Without cert, the
                                   #   console is plain HTTP on bind:port, as before v1.5.0: then
                                   #   keep bind = 127.0.0.1, and see hostnames and secure_cookie
password = change-me-then-restart  # typed as plain text; at start-up (and on reload) the proxy replaces
                                   #   this line with  password_hash = "$argon2id$..."  and logs it.
                                   #   To change the password later, put a  password =  line back.
                                   #   Or generate the hash yourself:  tlsproxy --hash-password

# Plain HTTP only (no cert):
# hostnames = console.lan          # extra names the console answers to, besides IP addresses and
#                                  #   "localhost" (protection against DNS rebinding)
# secure_cookie = true             # HTTPS-only cookies, when another proxy publishes it over TLS

# A password is always required. Sign-ins are rate limited (5 failures, then
# 30 s doubling up to 15 min), sessions last 12 hours, every change needs the
# session's CSRF token. This file is read again on every reload: the
# password and the name follow it; with cert, so do bind and port. Plain
# HTTP's bind and port need a restart.
#
# Saving from the console's editor (config.toml only): the text is validated
# with this file merged in (an invalid config is never written), the save is
# refused if the file changed since the editor loaded it, the previous file is
# kept as config.toml.<timestamp>.bak (last 10), and the new config is applied
# at once.

# The original example: map *.wushilin.net to *.wushilin.internal.net.
# A * is exactly one label: a.b.wushilin.net is not covered (that would be
# domain: "*.*.wushilin.net", with ${1} and ${2}).
#
# Expected routing (checked by `go test`):
#> foo.wushilin.net        => foo.wushilin.internal.net:443
#> FOO.Wushilin.NET        => foo.wushilin.internal.net:443
#> a.b.wushilin.net        => DENY
#> wushilin.net            => DENY
#> foo.wushilin.net.evil.io => DENY
#> <none>                  => DENY

listeners:
  - name: https
    bind: [0.0.0.0]
    port: 443

routes:
  - listener: https
    rules:
      - domain: "*.wushilin.net"
        action: allow
        target: "${1}.wushilin.internal.net:443"

      # Everything else. (A name that matches no rule is denied anyway; this makes it explicit.)
      - domain: $anything_else
        action: deny

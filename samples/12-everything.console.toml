# The console's own file, given with --console 12-everything.console.toml.
# The console can't change it. Read again on every reload.

[console]
bind = "::"                        # with cert: joins the [[listener]] with exactly this bind and port
port = 443
hostname = console.example.com     # served under this name, over TLS, on that listener
cert = auto                        # or local-ca / local-ca:ca002; without cert: plain HTTP on bind:port
password_hash = "$argon2id$v=19$m=65536,t=3,p=4$c29tZXNhbHQ$ZVrRXqxlLcWfcXCnMyv0m4Rpvh/bnCi7"
# password = plain text here instead; the proxy replaces it with password_hash on start
#
# Plain HTTP only (no cert):
# hostnames = console.lan, admin.lan   # names it answers to, besides IP addresses and localhost
# secure_cookie = true                 # HTTPS-only cookies, when another proxy publishes it over TLS

# Egress allowlist: clients (e.g. IoT VLAN, redirected by a pfSense NAT port
# forward on :443) may only reach approved sites; the proxy connects to the
# real hostname ($0 = the whole SNI).
#
#> github.com                 => github.com:443
#> api.github.com             => api.github.com:443
#> objects.githubusercontent.com => objects.githubusercontent.com:443
#> time.apple.com             => time.apple.com:443
#> deb.debian.org             => deb.debian.org:443
#> security.debian.org        => security.debian.org:443
#> evilgithub.com             => DENY
#> github.com.evil.io         => DENY
#> tracker.example.net        => DENY
#> <none>                     => DENY

[global]
bind = 0.0.0.0
port = 8443
max_connections = 256

[[host]]
pattern = (?:[a-z0-9-]+\.)*(github\.com|githubusercontent\.com)
target_host = $0

[[host]]
pattern = time\.apple\.com
target_host = $0

[[host]]
pattern = (deb|security)\.debian\.org
target_host = $0

[[host]]
pattern = .*
action = deny

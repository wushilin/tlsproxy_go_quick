# Listen on all IPv6 (and, depending on OS settings, IPv4) addresses with
# every tuning knob spelled out. Values may be quoted or bare.
#
#> mail.example.com   => [::1]:993
#> x.example.com      => DENY

global:
  handshake_timeout: 5        # seconds to receive the ClientHello
  connect_timeout: 3          # seconds to connect to the target
  idle_timeout: 300           # no traffic for N seconds closes; 0 disables
  half_close_timeout: 10      # after one side closes, the other gets N seconds; 0 = unlimited
  max_connections: 4096
  buffer_size: 65536          # bytes moved per step (4096..131072)
  buffer_pool_max_idle: 1024  # free buffers kept for reuse; default 2 x max_connections

listeners:
  - name: https
    bind: ["::"]              # quoted: a bare :: is not a YAML string
    port: "443"

routes:
  - listener: https
    rules:
      - domain: "mail.example.com"
        action: "allow"
        target: "[::1]:993"   # an IPv6 target in brackets

      - domain: $anything_else
        action: 'deny'

# Every supported option in one file, each with a non-default value where that
# makes sense. `go test` checks that no option is missing here, so this file
# is a complete reference. See config.toml for the defaults.
#
#> <none>                 => 10.0.0.99:8443
#> nas.example.com        => 192.168.1.10:5001
#> www.example.com        => 192.168.1.30:8080
#> shop.example.com       => 192.168.1.30:8080
#> api.svc.example.com    => backend-api.lan:443
#> blocked.example.com    => DENY
#> legacy.example.com     => 192.168.1.50:443
#> other.org              => DENY

# One listener here, from [global] bind and port; for several, with
# [[listener]] sections and listener = <name> in each rule, see
# 14-listeners.toml.

[global]
bind = "::"                        # :: = all IPv6 and IPv4 addresses; or a list: 192.0.2.1; 2001:db8::1
port = 443                         # required

handshake_timeout = 5              # seconds to receive the whole ClientHello
connect_timeout = 3                # seconds to resolve and connect to the target
idle_timeout = 300                 # close after this long without traffic either way; 0 = never
half_close_timeout = 10            # after one side closes, the other gets this long; 0 = unlimited

max_connections = 4096             # more are rejected; goroutines <= 2 x this
proxy_protocol_from = 10.0.0.2; 10.1.0.0/16   # load balancers that may state the client's address (PROXY protocol); default nobody
max_handshakes_per_ip = 32         # per source, connections still sending their ClientHello; default 64, 0 = unlimited
buffer_size = 32768                # bytes moved per step (4096..131072); pipe size when spliced, else two pooled buffers
buffer_pool_max_idle = 2048        # free buffers kept for reuse; default 2 x max_connections
short_read_delay_us = 0            # microseconds to pause after a short read; 0 = off (little gain in Go)
splice = true                      # Linux: relay passed-through connections in the kernel (zero copy)

allow_cache_size = 8192            # LRU of allowed SNI -> target decisions; 0 = off
deny_cache_size = 1024             # separate LRU of denied SNIs; 0 = off

reload_interval = 10               # re-read this file every N seconds; minimum 5, 0 = only via the console
stats_interval = 300               # log a summary line every N seconds; 0 = never

# Certificates, for rules with cert = ...
cert_path = /var/db/tlsproxy/certs       # <cert_path>/<name>/cert.pem + key.pem, account key in _account/
ca_root = /var/db/tlsproxy/ca            # your own CAs for cert = local-ca: ca001/, ca002/, ...
expiry_threshold_days = 20               # renew this long before expiry (or at 1/3 of the lifetime left)
acme_agree_tos = true                    # required for cert = auto
acme_email = admin@example.com           # optional account contact
acme_directory = https://acme-staging-v02.api.letsencrypt.org/directory   # default: Let's Encrypt production
acme_ca_file = /usr/local/etc/ssl/private-ca.pem   # extra root for the ACME server's own HTTPS
public_ip_address = 203.0.113.7; 2001:db8::1       # only ask the CA for names resolving to one of these
dns_resolvers = 9.9.9.9; 1.1.1.1:53                # resolvers for that check (IP or IP:port); required with public_ip_address

# Legacy keys, accepted so older config files keep loading, and ignored:
io_model = events
worker_threads = 4

[logging]
stdout = /var/log/tlsproxy/stdout.log    # activity; unset = the process's stdout
stderr = /var/log/tlsproxy/stderr.log    # problems; unset = the process's stderr
max_size = 50M                           # rotate at this size (K / M / G, KiB / MiB / GiB, or bytes)
max_keep = 14                            # rotated generations kept
compress_after = 2                       # generations above this number are gzip

[console]
listen = 127.0.0.1
port = 9443
password_hash = "pbkdf2-sha256$600000$rbT1NRdts8POqh5mv9xJ4w$2aWzIzv9nmj1Xh6pT3q5N0p3rGZr7m9sQ0Y8v1o2bXk"
# password = plain text here instead; the proxy replaces it with password_hash on start
secure_cookie = true              # browser sessions require HTTPS through the terminating rule
hostnames = console.example.com, admin.example.com

# ---- rules: the most specific wins (see 13-rule-precedence); no match = deny --

# Clients without SNI (pattern NONE, any letter case).
[[host]]
pattern = NONE
target_host = 10.0.0.99
target_port = 8443

# Terminate TLS, automatic certificate; the name comes from the literal pattern.
# The upstream speaks TLS with a self-signed certificate.
[[host]]
pattern = nas.example.com
action = allow                     # the default
cert = auto
target_host = 192.168.1.10
target_port = 5001
upstream_tls = true                # the default when cert is set
upstream_tls_verify = false        # default true: verify against the system roots
upstream_sni = nas.internal.lan    # default: the name the client asked for
proxy = true                       # default false: send original connection addresses upstream
proxy_version = 2                  # default 2; may be 1 or 2
max_aggregated_speed = 1Gbit       # default unlimited: all connections of this rule, each direction
max_single_connection_speed = 15MiB/s # default unlimited: each connection, each direction

# Terminate TLS for a wildcard: the exact names must be listed. shop matches the
# pattern but is not listed, so it gets a self-signed placeholder.
[[host]]
pattern = *.example.com
cert = auto
cert_domains = www.example.com, blog.example.com
target_host = 192.168.1.30
target_port = 8080
upstream_tls = false               # plaintext upstream: only http/1.1 is offered to clients

# Terminate TLS for names that are not known in advance: a script decides, per
# name, whether a certificate is requested. Run as `<script> <name>` when a
# certificate has to be issued or renewed; exit 0 accepts, anything else refuses
# (so does no answer within 20 s). cert_domains may be given as well: listed
# names are never put to the script.
[[host]]
pattern = *.customers.example.com
cert = auto
cert_validate_script = /usr/local/etc/tlsproxy/domains.sh
cert_validate_args = ["${host}"]         # default: the name alone; e.g. ["--customer", "aaa-${1}", "${host}"]
target_host = 192.168.1.50
target_port = 8080
upstream_tls = false

# Terminate TLS with your own CA (ca002 in ca_root): a certificate per name,
# issued the first time a client asks and renewed automatically. Clients must
# trust the CA (download it from the console's CAs page).
[[host]]
pattern = *.lab.internal
cert = local-ca:ca002
cert_domains = git.lab.internal, *.ci.lab.internal # optional: names or globs; any other name is refused
upstream_tls = false
target_host = 10.0.0.30

# Pass-through with a capture in the target: each * is ${1}, ${2}, ... from the left;
# ${host} is the whole name. Braces are required, so ${1}hello is exact.
[[host]]
pattern = *.svc.example.com
target_host = backend-${1}.lan

[[host]]
pattern = blocked.example.com
action = deny

# Pass-through: the backend keeps its own certificate.
[[host]]
pattern = legacy.example.com
target_host = 192.168.1.50
target_port = 443

[[host]]
pattern = ANY
action = deny

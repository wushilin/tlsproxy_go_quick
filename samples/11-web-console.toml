# The web console: dashboard, open connections, certificates, recent log and a
# config editor. Its settings are not in this file: they are in
# 11-web-console.console.toml, given at start-up with
#
#   tlsproxy 11-web-console.toml --console 11-web-console.console.toml
#
# That file says bind = 0.0.0.0, port = 443 and cert = auto: the same address
# as the [[listener]] below, so the console joins it. It gets a rule of its
# own there, for console.example.com, served over TLS inside this process
# with a certificate like any other name; nothing in this file can override
# it, and the console can't stop it or its listener. Delete the listener and
# the console keeps that address on a listener of its own.
#
#> console.example.com   => CONSOLE
#> www.example.com       => 10.0.0.10:443
#> other.org             => DENY

[[listener]]
name = https
bind = 0.0.0.0
port = 443

[global]
cert_path = /var/db/tlsproxy/certs
acme_agree_tos = true
public_ip_address = 203.0.113.7
dns_resolvers = 1.1.1.1; 8.8.8.8

# No [[host]] for console.example.com: console.toml has it. A rule for that
# exact name on this listener would be refused.

[[host]]
listener = https
pattern = www.example.com
target_host = 10.0.0.10
target_port = 443

[[host]]
listener = https
pattern = ANY
action = deny

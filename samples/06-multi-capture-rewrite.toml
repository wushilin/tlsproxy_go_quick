# Rewrite with several capture groups: <svc>.<env>.example.com -> <svc>.<env>.svc.cluster.local
# ${N} form is handy when a digit or letter follows the reference.
#
#> web.prod.example.com     => web.prod.svc.cluster.local:443
#> api-v2.dev.example.com   => api-v2.dev.svc.cluster.local:443
#> web.staging.example.com  => DENY
#> a.b.prod.example.com     => DENY
#> node3.example.com        => node3-mgmt.lan:8443
#> node12.example.com       => node12-mgmt.lan:8443

[global]
bind = 0.0.0.0
port = 443

[[host]]
pattern = ([a-z0-9-]+)\.(dev|prod)\.example\.com
target_host = $1.$2.svc.cluster.local

[[host]]
pattern = node(\d{1,3})\.example\.com
target_host = node${1}-mgmt.lan
target_port = 8443

[[host]]
pattern = .*
action = deny

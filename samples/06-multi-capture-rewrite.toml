# Rewrite with several captures: <svc>.<env>.example.com -> <svc>.<env>.svc.cluster.local
# Each * is a capture, numbered from the left: $1, $2, ... ($0 is the whole name).
# The ${N} form is handy when a digit or letter follows the reference.
#
#> web.prod.example.com     => web.prod.svc.cluster.local:443
#> api-v2.dev.example.com   => api-v2.dev.svc.cluster.local:443
#> web.staging.example.com  => DENY
#> a.b.prod.example.com     => DENY
#> node3.example.com        => node3-mgmt.lan:8443
#> node12.example.com       => node12-mgmt.lan:8443
#> eu-web.example.com       => web.eu.lan:443

[global]
bind = 0.0.0.0
port = 443

# Only these two environments: one rule each (there is no "dev or prod").
[[host]]
pattern = *.dev.example.com
target_host = $1.dev.svc.cluster.local

[[host]]
pattern = *.prod.example.com
target_host = $1.prod.svc.cluster.local

# A * inside a label: node3, node12, ...
[[host]]
pattern = node*.example.com
target_host = node${1}-mgmt.lan
target_port = 8443

# Two captures in one label, used in the other order.
[[host]]
pattern = *-*.example.com
target_host = $2.$1.lan

[[host]]
pattern = ANY
action = deny

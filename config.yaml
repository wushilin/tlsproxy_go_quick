# tlsproxy config, in YAML. Values may be bare, "double-quoted" or
# 'single-quoted'; quote one that starts with * [ { $ or contains ": " or " #"
# (domain: "*.example.com", target: "${1}.lan:443"). A list is a YAML list:
# [a, b] or one "- item" per line. Unknown keys and keys given twice are errors.
#
# Sections: global, logging, listeners, routes, basic_auth. Every
# commented-out setting below marked "(default: ...)" shows its DEFAULT
# value: uncommenting the line (remove "# ") unchanged changes nothing (this
# is checked by `go test`). Only a listener with a name and a port is
# required.
#
# This file is written for a proxy whose web console is NOT on port 443:
#   tlsproxy config.yaml -noconsole
#   CONSOLE_PASSWORD=... tlsproxy config.yaml -console_domain admin.example.com -console_port 9443
# With the console on its default port 443 it owns the listener https: then
# drop bind and port from https below (see "Web console").

listeners:
  - name: https                 # (required) unique; what listener: in routes names
    bind: [0.0.0.0]             # (default: 0.0.0.0) listen addresses: 0.0.0.0 = all IPv4, :: = all IPv6 and IPv4;
                                #   or specific addresses, a list: [192.0.2.1, "2001:db8::1"]
    port: 443                   # (required) listen port

global:
# --- Timeouts, in seconds -----------------------------------------------
#   handshake_timeout: 10       # (default: 10) max time to receive the whole ClientHello
#   connect_timeout: 10         # (default: 10) max time to connect to the target
#   idle_timeout: 600           # (default: 600) close after N s with no traffic either way; 0 = never
#   half_close_timeout: 30      # (default: 30) after one side closes, the other gets N s; 0 = unlimited

# --- Limits and memory ----------------------------------------------------
#   max_connections: 1024       # (default: 1024) more are rejected; goroutines <= 2 x this
#   proxy_trust_source: [10.0.0.2, 10.1.0.0/16]   # (nobody unless set) load balancers in front of this
#                               #   proxy that may state the client's address in a PROXY protocol header
#                               #   (v1 or v2). From anybody else a header is never looked for.
#                               #   (Called proxy_protocol_from before v1.5.0.)
#   max_handshakes_per_ip: 64   # (default: 64) connections from one source (IPv4 address or IPv6 /64)
#                               #   that have not sent their ClientHello yet; more are closed at once,
#                               #   so one address cannot hold every slot with silent sockets. 0 = unlimited
#   buffer_size: 65536          # (default: 65536 = 64 KiB) the most bytes moved per step, in each
#                               #   direction: the kernel pipe size when spliced (Linux passthrough),
#                               #   else a pooled buffer (2 held per open connection). Clamped to
#                               #   4096..131072 (4 KiB..128 KiB), with a warning
#   buffer_pool_max_idle: 2048  # (default: 2 x max_connections) free buffers kept for reuse

# --- Route cache (LRU, keyed by lowercased SNI; cleared on every reload) ------
#   allow_cache_size: 4096      # (default: 4096) cached allowed names -> target; 0 = off
#   deny_cache_size: 4096       # (default: 4096) cached denied names, kept separately so a
#                               #   flood of junk names can't evict the allowed ones; 0 = off

# --- Hot reload ------------------------------------------------------------------
#   reload_interval: 5          # (default: 5) check this file every N s and apply changes;
#                               #   min 5 (at most one reload per 5 s), 0 = never.
#                               #   listeners open, move and close live; an invalid file is ignored

# --- HTTP to HTTPS ----------------------------------------------------------------
#   http_to_https_redirect: false # (default: false) also listen on port 80, on every address the
#                               #   listeners use, and redirect each plain HTTP request to the same
#                               #   URL on https:// (301 for GET/HEAD, 308 otherwise). Every name is
#                               #   redirected; the rules on 443 decide from there. Listener name
#                               #   http-to-https-redirect (reserved); Stop/Start in the console

# --- Loop detection -----------------------------------------------------------------
#   remember_nonce: true        # (default: true) remember a hash of every ClientHello passed
#                               #   through for 10 s (at most 1M, newest win) and refuse one that
#                               #   comes back: this proxy's own connection reaching itself again
#                               #   (a name or ${host} target pointing here). Terminated TLS: not covered

# --- Throughput tuning ------------------------------------------------------------
#   short_read_delay_us: 0      # (default: 0 = off) pause N microseconds after a short read so
#                               #   data batches up: less CPU per GiB, more latency per round trip
#   splice: true                # (default: true) on Linux, relay passed-through connections with
#                               #   splice(2): bytes go socket -> kernel pipe -> socket, never copied
#                               #   into the proxy. Terminated TLS is always copied. Ignored elsewhere

# --- State reporting ------------------------------------------------------------
#   stats_interval: 60          # (default: 60) log one summary line every N s; 0 = never.
#                               #   `kill -USR1 <pid>` logs the summary plus every open connection

# --- Certificates (only for rules that terminate TLS with cert: ...) ------------
#   cert_root: ./certs          # (default: ./certs) every certificate: your CAs in <cert_root>/ca001/
#                               #   (the default CA), ca002/, ... with what they issue; the automatic
#                               #   ones in <cert_root>/acme/<name>/cert.pem, key.pem, account key in acme/_account/.
#                               #   Was ca_root and cert_path before v1.5.0
#   expiry_threshold_days: 15   # (default: 15) renew this many days before expiry (or when a third
#                               #   of the lifetime is left, if that is later); failures retry every 6 h
  acme_agree_tos: true          # false unless set; must be true for cert: auto: you accept the CA's
                                #   terms. Set here for the cert: auto rule for myhome below
#   acme_email: you@example.com #   optional contact for expiry notices
#   acme_directory: https://acme-v02.api.letsencrypt.org/directory   # (default: Let's Encrypt production)
#                               #   staging: https://acme-staging-v02.api.letsencrypt.org/directory
#   acme_ca_file: /path/root.pem #  extra root CA for the ACME server's own HTTPS (private CA, Pebble)
#   public_ip_address: [203.0.113.7, "2001:db8::1"]
#                               #   cert: auto only asks the CA if the name publicly resolves to one
#                               #   of these, so a misconfigured name can't burn the CA's rate limits
#   dns_resolvers: [1.1.1.1, 8.8.8.8, "2606:4700:4700::1111", "2001:4860:4860::8888"]
#                               #   (no default; required with cert: auto and public_ip_address) public
#                               #   DNS servers for that check, IP or IP:port ("[v6]:port"). Three attempts,
#                               #   each the next server in turn, each given 3 s; no answer at all = no
#                               #   certificate requested. Not the local one, which may answer with LAN addresses

# --- Compatibility ---------------------------------------------------------------
# io_model and worker_threads are legacy keys of global. They are accepted and
# ignored (with a log line), so older config files keep loading.

# --- Logging -------------------------------------------------------------------
# Two streams: normal activity ("stdout": accepted / route / connected / closed,
# stats, reloads) and problems ("stderr": accept errors, failed reloads, ...).
# Without a file, a stream goes to the process's own stdout / stderr. With a
# file, nothing of that stream reaches the terminal. Relative paths are
# relative to the working directory. Both may name the same file.
logging:
#   stdout: /var/log/tlsproxy/stdout.log
#   stderr: /var/log/tlsproxy/stderr.log
#   max_size: 15MiB             # (default: 15MiB) rotate once a file reaches this (K / M / G)
#   max_keep: 10                # (default: 10) generations kept: file.1 (newest) .. file.10
#   compress_after: 3           # (default: 3) file.1-.3 stay plain, file.4.gz and older are gzip
#                               #   (>= max_keep: never compress). Compression runs in-process in
#                               #   the background under a guard: until it finishes the log does
#                               #   not rotate again, the live file just grows past max_size.

# --- Web console ----------------------------------------------------------------
# Dashboard, connections, certificates, log and a config editor. Its settings
# are not in this file (a console: section here is an error) but given at
# start-up, so no change made from the console can change its password or take
# it off the network. It is ON by default:
#
#   -console_domain <name>  or $CONSOLE_DOMAIN   (required) the name it is served under
#   $CONSOLE_PASSWORD                            (required) the password, or an $argon2id$... hash
#                                                from `tlsproxy --hash-password`
#   -console_bind <addr>    or $CONSOLE_BIND     all addresses (0.0.0.0) unless set
#   -console_port <n>       or $CONSOLE_PORT     443 unless set
#   -console_cert <c>       or $CONSOLE_CERT     auto unless set (needs acme_agree_tos: true),
#                                                or local-ca / local-ca:ca002
#   -noconsole                                   no console at all
#
# Without a domain and a password the proxy refuses to start (a --test dry run
# doesn't need them). Flags take one or two dashes, -flag value or -flag=value:
#
#   CONSOLE_PASSWORD='change-me' tlsproxy config.yaml -console_domain admin.example.com -console_port 9443
#
# The console is always served over TLS, inside this process, with Secure
# cookies. It owns a listener: named https when on port 443, console_http on
# any other. That listener's name, bind and port and the console's rule for
# its domain are fixed: this file may list it under listeners by name with
# other options only (proxy_trust_source, max_connections, timeouts, speed
# limits; a bind or port there is an error), and routes may add rules to it,
# except for the console's exact domain (an error). Another listener with
# exactly the console's bind and port is an error. The console can't stop its
# rule or its listener. Its config editor edits this file only.
#
# Without a console nothing is reserved: you name all listeners (even https).

# --- Listeners -------------------------------------------------------------------
# Every port is an item of listeners (at least one; bind and port are not
# global settings). Each listener has its own rules, grouped under routes by
# its name, even when there is only one. See samples/14-listeners.yaml.
#   name        (required) up to 64 letters, digits, spaces and -_@#~()[]<>"'; unique ignoring
#               case; what listener: in routes refers to. Quote it if it has spaces or
#               quotes: name: "Kafka (EU)"
#   bind        as in the https listener above (0.0.0.0 unless set); a list, or one address
#   port        (required)
#   Optional, each overriding global for this listener only:
#   proxy_trust_source, handshake_timeout, idle_timeout, half_close_timeout,
#   max_connections (a cap for this listener, on top of the global one), and
#   max_aggregated_speed / max_single_connection_speed (for all connections on
#   the listener together / each of them, on top of each rule's own limits)
#
#   listeners:
#     - name: lab
#       bind: [10.11.12.212]
#       port: 9092
#       proxy_trust_source: [10.11.12.1]
#       max_connections: 200
#       idle_timeout: 3600
#       max_aggregated_speed: 200Mbit

# --- Rules -------------------------------------------------------------------
# routes is a list of items, one per listener: listener: <name> and its rules,
# a list. The most specific rule wins, wherever it stands in the file; a name
# matching no rule is denied. All matching ignores case.
# domain      (required) one of, in order of precedence:
#               $no_sni                 only clients that send no SNI
#               vq.example.com       a literal name: exact match, always wins
#               *.example.com        wildcard: a * never crosses a dot. As a whole label it is
#                                    exactly one label (not a.b.example.com, not example.com);
#                                    inside a label it is any run of characters, none included
#                                    (abc*.x.com matches abc1.x.com and abc.x.com). Several * are
#                                    fine: *.*.example.com. More literal characters win.
#                                    Quote it: domain: "*.example.com"
#               $anything_else                  everything, with or without SNI: always last
#             No regular expressions, no **, no "a or b": one rule per name and per depth.
# action      (default: allow) allow | deny; deny sends a TLS access_denied alert
# target      (required for allow) host:port, e.g. "10.0.0.5:443"; an IPv6 host in brackets,
#             "[2001:db8::1]:443". There is no default port. ${1}, ${2}, ... = what each *
#             matched, from the left; ${host} (or ${0}) = the whole SNI: "${1}.internal:443".
#             Always in braces: a bare $1 is an error
#
# TLS termination (optional; without cert the TLS stream is passed through untouched):
# cert        auto       issue and renew through ACME with TLS-ALPN-01 (the CA connects to public
#                        port 443; no port 80 needed). A domain with * (or $anything_else) also needs cert_domains
#                        and/or cert_validate_script.
#             local-ca   your own CA: plain local-ca is ca001, the default CA, made at start-up when
#                        cert_root has none ("Local CA", 20 years; the log names its ca_cert.pem to install).
#                        local-ca:ca002 and on must exist (generate or import them on the console's
#                        Certificates page). One certificate per name,
#                        issued the first time a client asks, renewed before it expires (checked every 6 h);
#                        anything in the folder that the CA did not issue is moved to _archive and
#                        deleted after 14 days. Clients must trust the CA. cert_domains, if set: names
#                        or globs (*.dev.abc.com, *.abc.com) that get one; any other name is refused
#                        (no placeholder). It also serves clients without SNI (domain $no_sni or $anything_else):
#                        see cert_domains. Only local-ca can: ACME needs a host name
# cert_domains           a list of names to issue, e.g. [a.example.com, b.example.com] (each must match
#                        the domain). local-ca with $no_sni or $anything_else: IP addresses too, e.g.
#                        [203.0.113.5, 198.51.100.7]. A client without SNI gets one certificate for all
#                        of them (a $no_sni rule may add host names to it); none listed: one for the address
#                        it connected to. A client that sends an IP address as SNI is refused unless it is listed
# cert_validate_script   decides about names that match the domain but are not in cert_domains:
#                        run as `<script> <name>`, exit 0 = issue a certificate, anything else = don't.
#                        Only run when a certificate must be issued or renewed (never per connection);
#                        killed after 20 s, which counts as a refusal. Every decision is logged.
# cert_validate_args     (default: ["${host}"]) the script's arguments, a list of strings;
#                        each is fixed text with ${1}, ${2}, ... ${host} filled in as in target,
#                        e.g. ["--customer", "aaa-${1}", "${host}"]
# upstream_tls           (default: true) connect to the target with TLS; set false for a plaintext target
# upstream_tls_verify    (default: true) verify the target's certificate against the system roots
# upstream_sni           the name sent to the target as SNI and checked in its certificate.
#                        Default: the name the client asked for, so a target that itself routes
#                        by SNI (another proxy) works even when the target is an IP address
# proxy                  (default: none) v1 or v2, any allow rule, passed through or terminated: tell
#                        the target the client's address (and the address it connected to) in a PROXY
#                        protocol header of that version, sent before the ClientHello / upstream TLS /
#                        plaintext. The target must expect it (nginx: listen ... proxy_protocol)
#
# Speed limits (optional, any allow rule; each direction separately; default unlimited):
# max_aggregated_speed          shared by every connection this rule matches, e.g. 1Gbit, 100MB/s
# max_single_connection_speed   for each connection, e.g. 15MiB/s, 512KB, 20Mbps
#                               units: B KB MB GB (1000), KiB MiB GiB (1024), bit Kbit Mbit Gbit
#                               (also bps Kbps Mbps Gbps); /s optional
#
# Serving HTTP here (optional): instead of a target, give the rule serve, a list
# of entries. The proxy terminates TLS (cert is required) and answers the
# requests itself, with no second hop: no target, upstream_* or proxy. The
# longest prefix that matches the path serves a request; the same prefix twice
# is an error; no match is 404; /api for the prefix /api/ is a 301 to /api/.
#   {type: reverse_proxy, prefix: /api/, target: "http://127.0.0.1:8080"}
#       target          http://host:port or https://host:port (no path)
#       strip_prefix    true: /api/x is sent as /x (default false)
#       force_host      the Host sent on (default the client's)
#       tls_verify      false: an https:// target's certificate is not checked (default true)
#     The target gets X-Forwarded-For / X-Real-IP (the client's address), X-Forwarded-Proto
#     (https) and X-Forwarded-Host; whatever the client sent in those, or in Forwarded, is
#     replaced.
#   {type: static_content, prefix: /assets/, base_dir: /opt/www/assets}
#     The prefix (ending in /) stands for base_dir: /assets/a.css is base_dir/a.css.
#     GET and HEAD; index.html for a folder, never a listing; no hidden files except
#     .well-known; no symlinks out of base_dir.
#   basic_auth: team on either: ask for a user of the basic_auth item named team.
# Clients get HTTP/2 if they ask. A request whose Host another rule serves gets 421.
# A reload applies to the next request, even on a connection already open.
#
#   - domain: www.wushilin.net
#     cert: auto
#     serve:
#       - {type: reverse_proxy, prefix: /api/, target: "http://localhost:42323", basic_auth: team}
#       - {type: static_content, prefix: /, base_dir: /opt/www/www.wushilin.net}

routes:
  - listener: https
    rules:
      - domain: myhome.wushilin.net
        action: allow
        cert: auto
        upstream_tls: false
        target: "127.0.0.1:3782"
        proxy: v2

      - domain: "*.wushilin.net"
        action: allow
        target: "${1}.wushilin.internal.net:443"

      - domain: $anything_else
        action: deny

# --- Basic auth (optional) ------------------------------------------------------
# Users that a serve entry can ask for with basic_auth: <name>. Each item has a
# name (unique) and users, a list of {username, password_hash} or {username,
# password_plain}. tlsproxy --hash-password prints an argon2id hash; argon2id
# hashes from other tools and the older pbkdf2-sha256$... work too (quote a
# hash: it starts with $). A user may also have disabled: true (refused, at
# once) and expires: 2026-12-31 (through the end of that day, UTC) or an RFC
# 3339 time; no expires = never. A password a browser sends is checked once
# and remembered in memory for 5 minutes.
#
# basic_auth:
#   - name: team
#     users:
#       - {username: jack, password_hash: "$argon2id$v=19$m=65536,t=3,p=4$..."}
#       - {username: jill, password_plain: "open sesame", expires: 2026-12-31}
#       - {username: joe, password_hash: "...", disabled: true}

# tlsproxy config. Values may be bare, "double-quoted" or 'single-quoted'.
#
# Every commented-out setting below shows its DEFAULT value: uncommenting a
# line unchanged changes nothing (this is checked by `go test`). Only
# `port` is required.

[global]
bind = 0.0.0.0                  # (default: 0.0.0.0) listen address; "::" for IPv6
port = 443                      # (required) listen port

# --- Timeouts, in seconds -----------------------------------------------
# handshake_timeout = 10        # (default: 10) max time to receive the whole ClientHello
# connect_timeout = 10          # (default: 10) max time to connect to the target
# idle_timeout = 600            # (default: 600) close after N s with no traffic either way; 0 = never
# half_close_timeout = 30       # (default: 30) after one side closes, the other gets N s; 0 = unlimited

# --- Limits and memory ----------------------------------------------------
# max_connections = 1024        # (default: 1024) more are rejected; goroutines <= 2 x this
# buffer_size = 65536           # (default: 65536) bytes per pooled buffer; 2 held per open connection
# buffer_pool_max_idle = 3072   # (default: 3 x max_connections) free buffers kept for reuse

# --- Route cache (LRU, keyed by lowercased SNI; cleared on every reload) ------
# allow_cache_size = 4096       # (default: 4096) cached allowed names -> target; 0 = off
# deny_cache_size = 4096        # (default: 4096) cached denied names, kept separately so a
#                               #   flood of junk names can't evict the allowed ones; 0 = off

# --- Hot reload ------------------------------------------------------------------
# reload_interval = 5           # (default: 5) check this file every N s and apply changes;
#                               #   min 5 (at most one reload per 5 s), 0 = never.
#                               #   bind/port changes need a restart; an invalid file is ignored

# --- Throughput tuning ------------------------------------------------------------
# short_read_delay_us = 0       # (default: 0 = off) pause N microseconds after a short read so
#                               #   data batches up: less CPU per GiB, more latency per round trip

# --- State reporting ------------------------------------------------------------
# stats_interval = 60           # (default: 60) log one summary line every N s; 0 = never.
#                               #   `kill -USR1 <pid>` logs the summary plus every open connection

# --- Logging -------------------------------------------------------------------
# Two streams: normal activity ("stdout": accepted / route / connected / closed,
# stats, reloads) and problems ("stderr": accept errors, failed reloads, ...).
# Without a file, a stream goes to the process's own stdout / stderr. With a
# file, nothing of that stream reaches the terminal. Relative paths are
# relative to the working directory. Both may name the same file.
[logging]
# stdout = /var/log/tlsproxy/stdout.log
# stderr = /var/log/tlsproxy/stderr.log
# max_size = 15MiB              # (default: 15MiB) rotate once a file reaches this (K / M / G)
# max_keep = 10                 # (default: 10) generations kept: file.1 (newest) .. file.10
# compress_after = 3            # (default: 3) file.1-.3 stay plain, file.4.gz and older are gzip
#                               #   (>= max_keep: never compress). Compression runs in-process in
#                               #   the background under a guard: until it finishes the log does
#                               #   not rotate again, the live file just grows past max_size.

# --- Rules -------------------------------------------------------------------
# Checked top to bottom; the first match wins; a name matching no rule is denied.
# pattern     (required) case-insensitive mini regex, must match the WHOLE SNI;
#             or the literal NONE (any case): only clients that send no SNI.
#             (for the regex form, a client without SNI is matched as "")
# action      (default: allow) allow | deny; deny sends a TLS access_denied alert
# target_host (required for allow) may use $1 / ${1} for groups, $0 = whole SNI
# target_port (default: 443)

[[host]]
pattern = (.*)\.wushilin\.net
action = allow
target_host = $1.wushilin.internal.net
target_port = 443

[[host]]
pattern = .*
action = deny
